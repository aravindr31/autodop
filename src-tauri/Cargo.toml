[package]
name = "autodop"
version = "0.1.0"
description = "AutoDOP desktop app — account lists + DOP scraper runner"
authors = ["Aravind"]
edition = "2021"

[lib]
name = "autodop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mongodb = "3.9.1"
futures-util = "0.3.34"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
