name: release

# Build AutoDOP for macOS, Windows and Linux and attach the installers to a
# GitHub release. Triggered when work lands on `main` — i.e. when a PR is
# merged — and gated behind the full test suite. PyInstaller cannot
# cross-compile and Tauri bundles per-OS, so every target builds on its own
# runner. The release version comes from `src-tauri/tauri.conf.json`: bump it
# (`npm run version:bump -- X.Y.Z`) in the PR you merge.
#
# Also runnable by hand from the Actions tab (workflow_dispatch).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - name: Install dependencies
        run: npm ci

      - name: Rust formatting
        run: cd src-tauri && cargo fmt --check

      - name: Rust tests
        run: cd src-tauri && cargo test --lib

      - name: Frontend type check
        run: cd frontend && npx astro check

      - name: Store smoke test
        run: cd frontend && npm run smoke

      # A merge must carry a version bump: refuse to release anything that
      # already exists, and refuse a tauri.conf.json that disagrees with the
      # package.json files `version:bump` keeps in step.
      - name: Guard — version must be new and consistent
        shell: bash
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version")
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION is already released — bump the version (npm run version:bump -- X.Y.Z) in this PR."
            exit 1
          fi
          for file in package.json frontend/package.json src-tauri/Cargo.toml; do
            if ! grep -q ""$VERSION"" "$file" && ! grep -q "^version = "$VERSION"" "$file"; then
              echo "::error::$file does not carry $VERSION — run npm run version:bump -- $VERSION."
              exit 1
            fi
          done
          echo "version $VERSION is new and consistent"

  build:
    needs: test # never ship a version the suite has not passed on
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # arm64
            name: macOS (Apple Silicon)
          - os: windows-latest
            name: Windows (x64)
          - os: ubuntu-22.04 # older glibc → runs on more distros
            name: Linux (x64)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      # Linux runners need the WebKit/GTK stack Tauri links against.
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libglib2.0-dev libdbus-1-dev

      - name: Install dependencies
        run: npm ci

      # The frozen runner is per-OS (PyInstaller cannot cross-compile).
      - name: Build scraper sidecar
        run: npm run build:sidecar

      - name: Build the app
        run: npm run build

      # Collect whatever Tauri produced for this platform.
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          case "${{ runner.os }}" in
            macOS)  cp src-tauri/target/release/bundle/dmg/*.dmg dist/ ;;
            Windows) cp src-tauri/target/release/bundle/nsis/*.exe dist/ 2>/dev/null || true
                     cp src-tauri/target/release/bundle/msi/*.msi dist/ 2>/dev/null || true ;;
            Linux)  cp src-tauri/target/release/bundle/appimage/*.AppImage dist/ 2>/dev/null || true
                    cp src-tauri/target/release/bundle/deb/*.deb dist/ 2>/dev/null || true ;;
          esac
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autodop-${{ runner.os }}
          path: dist/*

      # The release is named after the version in tauri.conf.json — one
      # merged PR per version. A re-run updates the same release.
      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Attach to release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: dist/*
          generate_release_notes: true