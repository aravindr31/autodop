[package]
name = "autodop"
version = "0.3.0"
description = "AutoDOP desktop app — account lists + DOP scraper runner"
authors = ["Aravind"]
edition = "2021"

[lib]
name = "autodop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mongodb = "3.9.1"
futures-util = "0.3.34"
hmac = "0.13.0"
sha2 = "0.11.0"
base64 = "0.23.1"
aes = "0.8"
cbc = { version = "0.1", features = ["block-padding"] }
getrandom = "0.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
