name: ci

# Gate: every push and PR runs the real test suite — Rust unit tests (which
# include the schema migration), the frontend type check, and the store smoke
# test. Releases (release.yml) only build once this has passed on the branch.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The Rust tests need SQLite only (bundled); no GTK stack required —
      # the app itself is not built here, that is release.yml's job.
      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - name: Install dependencies
        run: npm ci

      - name: Rust formatting
        run: cd src-tauri && cargo fmt --check

      - name: Rust tests
        run: cd src-tauri && cargo test --lib

      - name: Frontend type check
        run: cd frontend && npx astro check

      - name: Store smoke test
        run: cd frontend && npm run smoke