name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  pr-source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the source branch
        shell: bash
        run: |
          HEAD_BRANCH="${{ github.event.pull_request.head.ref }}"
          case "$HEAD_BRANCH" in
            main|master|develop|release*)
              echo "::error::PRs must come from a feature/fix/hotfix branch — '$HEAD_BRANCH' cannot be merged to main."
              exit 1 ;;
          esac
          echo "source branch '$HEAD_BRANCH' is fine"

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Rust formatting
        run: cd src-tauri && cargo fmt --check

      - name: Rust tests
        run: cd src-tauri && cargo test --lib

      - name: Frontend type check
        run: cd frontend && npx astro check

      - name: Store smoke test
        run: cd frontend && npm run smoke
