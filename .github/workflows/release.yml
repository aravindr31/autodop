name: "Release Pipeline"

on:
  push:
    branches: [ main ]
    paths:
    - 'frontend/**'
    - 'src-tauri/**'
    - 'package.json'
    - 'scraper.py'
    - '.github/**'

  workflow_dispatch:


permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Install Linux prerequisites
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
          libayatana-appindicator3-dev librsvg2-dev libssl-dev

    - name: Install dependencies
      run: |
        npm ci
        npm --prefix frontend ci

    - name: Rust formatting
      run: cd src-tauri && cargo fmt --check

    - name: Rust tests
      run: cd src-tauri && cargo test --lib

    - name: Frontend type check
      run: cd frontend && npx astro check

    - name: Store smoke test
      run: cd frontend && npm run smoke

  version:
    needs: test
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
    - uses: actions/create-github-app-token@v2
      id: app-token
      with:
        app-id: ${{ secrets.RELEASE_APP_ID }}
        private-key: ${{ secrets.RELEASE_APP_KEY }}

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ steps.app-token.outputs.token }}

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Derive the version from commit messages
      id: bump
      run: |
        node scripts/release-version.mjs
        VERSION=$(cat VERSION)
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

    - name: Commit the release and tag it
      id: commit
      run: |
        git config user.name "aravindr-release-bot[bot]"
        git config user.email "release@users.noreply.github.com"
        git add VERSION CHANGELOG.md package.json frontend/package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json
        git commit -m "chore(release): ${{ steps.bump.outputs.tag }} [skip ci]"
        git tag "${{ steps.bump.outputs.tag }}"
        git push origin "HEAD:main" --tags
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          name: macOS (Apple Silicon)
        - os: windows-latest
          name: Windows (x64)
        - os: ubuntu-22.04
          name: Linux (x64)
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.version.outputs.sha }}

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - uses: dtolnay/rust-toolchain@stable

    - name: Install Linux prerequisites
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
          librsvg2-dev patchelf libssl-dev libglib2.0-dev libdbus-1-dev

    - name: Install dependencies
      run: |
        npm ci
        npm --prefix frontend ci

    - name: Build scraper sidecar
      run: npm run build:sidecar

    - name: Build the app
      run: npm run build

    - name: Collect installers
      shell: bash
      run: |
        mkdir -p dist
        case "${{ runner.os }}" in
          macOS)  cp src-tauri/target/release/bundle/dmg/*.dmg dist/ ;;
          Windows) cp src-tauri/target/release/bundle/nsis/*.exe dist/ 2>/dev/null || true
                   cp src-tauri/target/release/bundle/msi/*.msi dist/ 2>/dev/null || true ;;
          Linux)  cp src-tauri/target/release/bundle/appimage/*.AppImage dist/ 2>/dev/null || true
                  cp src-tauri/target/release/bundle/deb/*.deb dist/ 2>/dev/null || true ;;
        esac
        ls -la dist/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: autodop-${{ runner.os }}
        path: dist/*

    - name: Release notes from the changelog entry
      shell: bash
      run: |
        awk -v h="## ${{ needs.version.outputs.tag }}" '$0==h || index($0, h " ")==1 {flag=1; print; next} /^## v/ {flag=0} flag' CHANGELOG.md > release-notes.md
        test -s release-notes.md || echo "AutoDOP ${{ needs.version.outputs.tag }}" > release-notes.md
        cat release-notes.md

    - name: Attach installers to the release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.version.outputs.tag }}
        body_path: release-notes.md
        files: dist/*
