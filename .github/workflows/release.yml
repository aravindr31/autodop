name: release

# Build AutoDOP for macOS, Windows and Linux and attach the installers to a
# GitHub release. PyInstaller cannot cross-compile and Tauri bundles per-OS,
# so every target builds on its own runner.
#
#   git tag v0.6.1 && git push --tags   → binaries appear on the release page

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # arm64
            name: macOS (Apple Silicon)
          - os: windows-latest
            name: Windows (x64)
          - os: ubuntu-22.04 # older glibc → runs on more distros
            name: Linux (x64)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      # Linux runners need the WebKit/GTK stack Tauri links against.
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libglib2.0-dev libdbus-1-dev

      - name: Install dependencies
        run: npm ci

      # The frozen runner is per-OS (PyInstaller cannot cross-compile).
      - name: Build scraper sidecar
        run: npm run build:sidecar

      - name: Build the app
        run: npm run build

      # Collect whatever Tauri produced for this platform.
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          case "${{ runner.os }}" in
            macOS)  cp src-tauri/target/release/bundle/dmg/*.dmg dist/ ;;
            Windows) cp src-tauri/target/release/bundle/nsis/*.exe dist/ 2>/dev/null || true
                     cp src-tauri/target/release/bundle/msi/*.msi dist/ 2>/dev/null || true ;;
            Linux)  cp src-tauri/target/release/bundle/appimage/*.AppImage dist/ 2>/dev/null || true
                    cp src-tauri/target/release/bundle/deb/*.deb dist/ 2>/dev/null || true ;;
          esac
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autodop-${{ runner.os }}
          path: dist/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true